# 配布用ビルド
#   - 手動実行（Actions タブ → Release build → Run workflow）: Artifacts に保存
#   - v で始まるタグを push（例: v0.4.0）: さらに GitHub Releases に公開
name: Release build

# 手動実行のみ（Actions タブ → Release build → Run workflow）
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "GitHub Releases に公開する（タグ名を下に入力）"
        type: boolean
        default: false
      tag:
        description: "公開するタグ名（例: v0.4.0）"
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  name: windows-x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,    name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.100
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # ring を ARM64 Windows 向けにビルドするには AArch64 対応の clang が必要
      - name: Install LLVM (Windows ARM64)
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\clang.exe")) {
            $ver = "22.1.4"
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-woa64.exe"
            Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\llvm.exe"
            Start-Process "$env:RUNNER_TEMP\llvm.exe" -ArgumentList "/S" -Wait
          }
          "CC_aarch64_pc_windows_msvc=$llvm\clang.exe"    >> $env:GITHUB_ENV
          "AR_aarch64_pc_windows_msvc=$llvm\llvm-lib.exe" >> $env:GITHUB_ENV
          & "$llvm\clang.exe" --version

      # すべてネイティブのランナーなので、ARM64 版もテストできる
      - name: Test core / fs
        run: cargo test -p renamer-core -p renamer-fs --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p renamer-gui --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/flex-renamer-${{ matrix.name }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/flex-renamer.exe" $exe
          Compress-Archive -Path $exe -DestinationPath "dist/flex-renamer-${{ matrix.name }}.zip" -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/bundle-macos.sh ${{ matrix.target }} ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: flex-renamer-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.publish && inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true